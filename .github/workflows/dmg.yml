name: Build DMG
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and DMG
        run: make dmg
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Javis-1.0.0
          path: dist/Javis-1.0.0.dmg
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Javis 1.0.0
          files: dist/Javis-1.0.0.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
